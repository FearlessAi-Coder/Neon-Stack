<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Neon Stack</title>
<meta name="description" content="Neon Stack: tap to stack blocks, perfect your drops, earn coins and unlock new looks. How high can you go?">
<meta name="theme-color" content="#07091c">
<meta property="og:title" content="Neon Stack">
<meta property="og:description" content="Tap. Stack. Don't miss. How high can you go?">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#07091c;--panel:rgba(14,16,44,.88);--line:rgba(255,255,255,.14);--fg:#fff;--mut:#9aa0d4;--ac:#ffd23f;--acfg:#1a1400;--pk:#ff4d9d;--cy:#2de2ff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07091c}}
:root[data-theme="dark"]{--bg:#07091c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Lilita One',system-ui,-apple-system,'Segoe UI',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:relative;margin:0 auto;height:100%;width:min(100vw,56.25vh);overflow:hidden}
@supports (height:100svh){.stage{height:100svh;width:min(100vw,56.25svh)}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px));text-align:center}
.ov[hidden],[hidden]{display:none!important}
h1{margin:0;font-size:clamp(46px,15vw,76px);line-height:.92;letter-spacing:.01em;text-shadow:0 0 28px var(--pk),0 4px 0 rgba(0,0,0,.35)}
h1 span{color:var(--cy);display:block;text-shadow:0 0 28px var(--cy),0 4px 0 rgba(0,0,0,.35)}
.tag{color:var(--mut);font-size:17px;margin-bottom:8px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.big{background:var(--ac);color:var(--acfg);font-size:30px;padding:14px 54px;border-radius:20px;box-shadow:0 6px 0 #b8891a,0 0 30px rgba(255,210,63,.45);width:min(280px,100%)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b8891a}
.sm{background:var(--panel);border:2px solid var(--line);font-size:19px;padding:10px 18px;border-radius:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.glow{animation:gl 1.2s ease-in-out infinite;border-color:var(--ac)}
@keyframes gl{50%{box-shadow:0 0 18px var(--ac)}}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 16px;font-size:20px}
#hud{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none}
#sc{font-size:76px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 24px rgba(255,255,255,.4)}
#cmb{height:30px;font-size:22px;color:var(--ac);text-shadow:0 0 14px var(--ac)}
#hc{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.score{font-size:92px;line-height:1}
.badge{background:var(--pk);color:#fff;border-radius:999px;padding:3px 14px;font-size:18px}
#shop{background:var(--panel);justify-content:flex-start;gap:10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.top{display:flex;width:100%;justify-content:space-between;align-items:center}
.top h2{margin:0;font-size:32px}
.tabs{display:flex;gap:8px;width:100%}
.tab{flex:1;padding:9px 4px;border-radius:12px;background:rgba(255,255,255,.08);font-size:15px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cy)}
.tab[aria-selected="true"]{background:var(--cy);color:#00222a}
.list{width:100%;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px;touch-action:pan-y}
.it{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border:2px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left}
.it.on{border-color:var(--ac)}
.pv{display:flex;flex-direction:column-reverse;width:46px;height:46px;border-radius:10px;overflow:hidden;flex:none}
.pv i{flex:1}
.pvb{width:46px;height:46px;border-radius:10px;flex:none}
.inf{flex:1;min-width:0}
.inf b{font-weight:400;font-size:20px;display:block}
.inf small{color:var(--mut);font-size:14px;font-family:system-ui,sans-serif}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.pips i.f{background:var(--ac)}
.buy{background:var(--ac);color:var(--acfg);border-radius:12px;padding:8px 14px;font-size:17px;white-space:nowrap}
.buy:disabled{background:rgba(255,255,255,.14);color:var(--mut)}
.toast{position:absolute;left:50%;top:22%;transform:translate(-50%,0);background:var(--ac);color:var(--acfg);padding:10px 20px;border-radius:14px;font-size:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.glow{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div id="hud" hidden><div id="sc">0</div><div id="cmb"></div></div>
  <div id="hc" class="chip" hidden>🪙 <span id="hcn">0</span></div>

  <div id="home" class="ov">
    <h1>NEON<span>STACK</span></h1>
    <div class="tag">Tap. Stack. Don't miss.</div>
    <div class="chip" id="chb" hidden></div>
    <div class="row"><div class="chip">Best <span id="hb">0</span></div><div class="chip">🪙 <span id="hcoin">0</span></div></div>
    <button class="big" id="play">PLAY</button>
    <div class="row">
      <button class="sm" id="mode">Mode: Classic</button>
      <button class="sm" id="hsb" hidden>Head start</button>
      <button class="sm" id="hshop">Shop</button>
      <button class="sm" id="daily">Daily gift</button>
      <button class="sm" id="snd" aria-label="Sound">Sound on</button>
    </div>
  </div>

  <div id="over" class="ov" hidden>
    <div class="tag" style="margin:0">Your tower</div>
    <div class="score" id="os">0</div>
    <div class="badge" id="nb" hidden>NEW BEST</div>
    <div class="row"><div class="chip">Best <span id="ob">0</span></div><div class="chip">+<span id="oc">0</span> 🪙</div></div>
    <button class="big" id="again">AGAIN</button>
    <div class="row"><button class="sm" id="share">Share score</button><button class="sm" id="oshop">Shop</button><button class="sm" id="ohome">Home</button></div>
  </div>

  <div id="shop" class="ov" hidden>
    <div class="top"><h2>Shop</h2><div class="row"><div class="chip">🪙 <span id="sc2">0</span></div><button class="sm" id="sx">Close</button></div></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="skins" aria-selected="true">Blocks</button>
      <button class="tab" role="tab" data-t="bgs" aria-selected="false">Worlds</button>
      <button class="tab" role="tab" data-t="ups" aria-selected="false">Boosts</button>
      <button class="tab" role="tab" data-t="qs" aria-selected="false">Quests</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div id="card" class="ov" hidden style="background:var(--panel)"><img id="cimg" alt="Your score card" style="width:min(70%,300px);border-radius:16px"><div class="tag">Press and hold the picture to save it</div><button class="sm" id="cx">Done</button></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const W=360;let H=640;
/* ---------- save ---------- */
const DEFS=()=>({coins:0,best:0,skin:'neon',bg:'night',own:['neon','night'],up:{perf:0,coin:0,save:0},daily:{last:'',streak:0},snd:1,games:0,bm:{classic:0,zen:0,rush:0,daily:0},mode:'classic',ach:{},hs:0,hson:0,fxs:'ring',ownfx:['ring'],dc:{day:''},q:{day:'',p:{blocks:0,perf:0,games:0},c:[false,false,false]},tot:{blocks:0,perf:0,maxc:0,gold:0,fever:0}});
let sv=DEFS();
try{const x=JSON.parse(localStorage.getItem('nstack1')||'null');if(x)sv=Object.assign(DEFS(),x,{up:Object.assign(DEFS().up,x.up||{}),daily:Object.assign(DEFS().daily,x.daily||{}),bm:Object.assign(DEFS().bm,x.bm||{}),tot:Object.assign(DEFS().tot,x.tot||{}),q:x.q||DEFS().q,ach:x.ach||{},ownfx:x.ownfx||['ring'],dc:x.dc||{day:''}})}catch(e){}
sv.bm.classic=Math.max(sv.bm.classic,sv.best||0);
const persist=()=>{try{localStorage.setItem('nstack1',JSON.stringify(sv))}catch(e){}};
/* ---------- catalog ---------- */
const SKINS={
 neon:{n:'Neon',p:0,f:i=>`hsl(${(200+i*12)%360} 90% 60%)`},
 candy:{n:'Candy',p:120,f:i=>`hsl(${(320+i*14)%360} 85% 74%)`},
 ocean:{n:'Ocean',p:250,f:i=>`hsl(${180+(i*7)%50} 80% ${50+(i%3)*5}%)`},
 gold:{n:'Gold',p:500,f:i=>`hsl(${40+(i*3)%16} 92% ${48+(i%2)*9}%)`},
 galaxy:{n:'Galaxy',p:800,f:i=>`hsl(${260+(i*9)%90} 80% ${52+(i%2)*8}%)`},
 lava:{n:'Lava',p:1200,f:i=>`hsl(${(i*4)%42} 96% ${48+(i%2)*8}%)`},
 ice:{n:'Ice',p:350,f:i=>`hsl(${195+(i*5)%25} 85% ${68+(i%2)*8}%)`},
 chrome:{n:'Chrome',p:650,f:i=>`hsl(220 ${8+(i%2)*6}% ${52+(i%4)*8}%)`},
 rainbow:{n:'Rainbow',p:1800,f:i=>`hsl(${(i*28)%360} 95% 58%)`}};
const BGS={
 night:{n:'Night',p:0,a:'#0a0e2e',b:'#232a6b'},
 sunset:{n:'Sunset',p:150,a:'#2b1055',b:'#ff7a59'},
 mint:{n:'Mint',p:300,a:'#0b2f33',b:'#5eead4'},
 void:{n:'Void',p:600,a:'#000000',b:'#1a1030'},
 aurora:{n:'Aurora',p:400,a:'#04122b',b:'#0fb68a'},
 retro:{n:'Retro',p:900,a:'#1a0033',b:'#ff2e88'}};
const UPS={
 perf:{n:'Perfect zone',d:'Wider zone counts as perfect',max:5,cost:l=>90*(l+1)},
 coin:{n:'Coin boost',d:'+15% coins per level',max:5,cost:l=>110*(l+1)},
 save:{n:'Second chance',d:'Forgive a missed block each run',max:2,cost:l=>[350,900][l]}};
/* ---------- sound & helpers ---------- */
let ac;
function tone(f,d=.09,t='sine',v=.12){if(!sv.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1900)}
/* ---------- canvas ---------- */
const cv=$('#c'),g=cv.getContext('2d'),stage=$('#stage');
let sc=1;
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;sc=cv.width/W;H=cv.height/sc}
addEventListener('resize',resize);resize();
const stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*2000,r:Math.random()*1.6+.4}));
/* ---------- game state ---------- */
const BH=26;let st='home',off=0,chall=0,parts=[],runBest=0,blocks=[],mv,dir=1,score=0,combo=0,runCoins=0,lives=0,cam=0,debris=[],fx=[],shake=0,flash=0;
const col=i=>SKINS[sv.skin].f(i);
const baseY=()=>H-150;
const sy=i=>baseY()-i*BH+cam;
function reset(real){
  const w0=sv.mode==='daily'?[200,150,115][dh()%3]:200;
  blocks=[{x:(W-w0)/2,w:w0,i:0}];off=0;
  if(real&&sv.hson&&sv.hs>0){sv.hs--;for(let k=1;k<10;k++)blocks.push({x:(W-w0)/2,w:w0,i:k});off=9;persist()}
  score=0;combo=0;runCoins=0;lives=sv.up.save;cam=0;debris=[];fx=[];dir=1;parts=[];runBest=chall||sv.bm[sv.mode];
  mv={x:0,w:w0,i:blocks.length};$('#sc').textContent='0';$('#cmb').textContent='';$('#hcn').textContent='0';
}
function begin(){reset(1);st='play';['#home','#over','#shop'].forEach(s=>$(s).hidden=true);$('#hud').hidden=false;$('#hc').hidden=false;tone(520,.1)}
function place(){
  if(st!=='play')return;
  const p=blocks[blocks.length-1],tol=4+sv.up.perf*2.5;
  const l=Math.max(mv.x,p.x),r=Math.min(mv.x+mv.w,p.x+p.w),ow=r-l;
  if(ow<=0){
    if(lives>0){lives--;toast('Second chance!');tone(300,.2,'triangle');buzz(30);mv.x=dir>0?-30:W-mv.w+30;return}
    return over(mv);
  }
  let nx=l,nw=ow;
  if(Math.abs(mv.x-p.x)<=tol){
    nx=p.x;nw=p.w;combo++;
    if(combo>=3)nw=Math.min(200,nw+5);
    fx.push({x:nx,w:nw,i:mv.i,t:0,s:sv.fxs});shake=sv.fxs==='bolt'?6:3;if(sv.fxs==='sparks')spark(nx+nw/2,sy(mv.i)-BH/2,16);sv.tot.maxc=Math.max(sv.tot.maxc,combo);
    $('#cmb').textContent=combo>=5?'FEVER x'+combo:combo>1?'PERFECT x'+combo:'PERFECT';
    tone(440+Math.min(combo,12)*60,.12,'triangle');buzz(10);runCoins+=2;qp('perf',1);
  }else{
    combo=0;$('#cmb').textContent='';tone(260,.07,'square',.06);
    if(mv.x<p.x)debris.push({x:mv.x,w:p.x-mv.x,i:mv.i,vy:0});
    if(mv.x+mv.w>p.x+p.w)debris.push({x:p.x+p.w,w:mv.x+mv.w-p.x-p.w,i:mv.i,vy:0});
  }
  blocks.push({x:nx,w:nw,i:mv.i,gold:mv.gold});score++;runCoins+=1;qp('blocks',1);if(mv.gold){runCoins+=8;sv.tot.gold++;toast('Gold block! +8');tone(900,.12,'triangle')}if(combo>=5){runCoins+=3;if(combo===5){sv.tot.fever++;toast('FEVER! Bonus coins')}}
  if(score%10===0){runCoins+=5;burst(40);toast('Tower '+score+'! +5 coins');tone(660,.1,'triangle');setTimeout(()=>tone(880,.14,'triangle'),110)}
  $('#sc').textContent=score;$('#hcn').textContent=Math.floor(runCoins*mult());
  mv={x:dir>0?W-nw+10:-10,w:nw,i:mv.i+1,gold:score>=5&&Math.random()<.1};dir*=-1;
}
function over(b){
  st='over';debris.push({x:b.x,w:b.w,i:b.i,vy:0});tone(150,.4,'sawtooth',.1);buzz([60,40,80]);shake=8;flash=1;
  let earned=Math.floor(runCoins*mult());const nb=score>sv.bm[sv.mode];
  if(sv.mode==='daily'&&score>=20&&sv.dc.day!==today()){sv.dc={day:today()};earned+=150;setTimeout(()=>toast('Daily goal! +150 coins'),700)}
  if(chall&&score>chall){chall=0;setTimeout(()=>toast('You beat your friend!'),700)}
  sv.coins+=earned;if(nb)sv.bm[sv.mode]=score;sv.games++;qp('games',1);checkAch();if(nb&&score>3)burst(70);persist();
  $('#hud').hidden=true;$('#hc').hidden=true;
  setTimeout(()=>{if(st!=='over')return;$('#os').textContent=score;$('#ob').textContent=sv.bm[sv.mode];$('#oc').textContent=earned;$('#nb').hidden=!nb;$('#over').hidden=false},650);
}
/* ---------- modes, quests, confetti ---------- */
const MODES={classic:{n:'Classic',d:'Speeds up as you climb',sp:2.3,ramp:.07,cap:3.8,m:1},zen:{n:'Zen',d:'Steady speed, half coins',sp:2,ramp:0,cap:0,m:.5},rush:{n:'Rush',d:'Fast start, 1.5x coins',sp:3.4,ramp:.1,cap:4.6,m:1.5},daily:{n:'Daily',d:'Same twist for all. 150 coins at 20',sp:2.6,ramp:.08,cap:4.2,m:1.25}};
const dh=()=>Math.floor(Date.now()/864e5);
{const m=/c=(\d+)/.exec(location.hash||'');if(m)chall=+m[1]}
const FX={ring:{n:'Ring',p:0,d:'Classic ring'},sparks:{n:'Sparks',p:200,d:'Gold sparks on perfects'},bolt:{n:'Lightning',p:500,d:'Double gold shockwave'}};
const mult=()=>(1+.15*sv.up.coin)*MODES[sv.mode].m;
function burst(n){for(let i=0;i<n;i++)parts.push({x:W/2,y:H*.4,vx:(Math.random()-.5)*10,vy:-Math.random()*9-2,c:`hsl(${Math.random()*360} 95% 60%)`,l:1})}
const QDEFS=[{k:'blocks',n:'Stack 40 blocks today',t:40,r:60},{k:'perf',n:'Land 12 perfects today',t:12,r:80},{k:'games',n:'Play 5 games today',t:5,r:40}];
function ensureQ(){const d=new Date().toISOString().slice(0,10);if(sv.q.day!==d)sv.q={day:d,p:{blocks:0,perf:0,games:0},c:[false,false,false]}}
function qp(k,n){ensureQ();sv.q.p[k]+=n;if(k!=='games')sv.tot[k]+=n}
const qReady=()=>{ensureQ();return QDEFS.some((q,i)=>sv.q.p[q.k]>=q.t&&!sv.q.c[i])||ACH.some(a=>sv.ach[a.id]===1)};
function spark(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:-Math.random()*5-1,c:'hsl('+(40+Math.random()*20)+' 100% 65%)',l:.7})}
const mb=()=>Math.max(...Object.values(sv.bm),sv.best||0);
const ACH=[
 {id:'first',n:'First stack',d:'Finish your first game',r:20,ok:()=>sv.games>=1},
 {id:'b25',n:'Tall tower',d:'Reach 25 blocks',r:50,ok:()=>mb()>=25},
 {id:'b50',n:'Skyscraper',d:'Reach 50 blocks',r:120,ok:()=>mb()>=50},
 {id:'b100',n:'Legend',d:'Reach 100 blocks',r:400,ok:()=>mb()>=100},
 {id:'p100',n:'Sharpshooter',d:'Land 100 perfects',r:100,ok:()=>sv.tot.perf>=100},
 {id:'c10',n:'Combo king',d:'Get a 10 perfect combo',r:120,ok:()=>sv.tot.maxc>=10},
 {id:'gold',n:'Gold digger',d:'Land 5 gold blocks',r:100,ok:()=>sv.tot.gold>=5},
 {id:'fever',n:'On fire',d:'Trigger fever mode',r:60,ok:()=>sv.tot.fever>=1},
 {id:'g25',n:'Regular',d:'Play 25 games',r:80,ok:()=>sv.games>=25}];
function checkAch(){ACH.forEach(a=>{if(!sv.ach[a.id]&&a.ok()){sv.ach[a.id]=1;setTimeout(()=>toast('Award unlocked: '+a.n),900)}})}
/* ---------- loop ---------- */
let last=0;
function frame(t){
  const dt=Math.min((t-last)/16.67||1,2.5);last=t;
  if(st==='play'){const M=MODES[sv.mode],sp=(M.sp+(sv.mode==='daily'?(dh()%4)*.3:0)+Math.min(score*M.ramp,M.cap))*(combo>=5?1.12:1);mv.x+=dir*sp*dt;if(mv.x<-40){mv.x=-40;dir=1}if(mv.x+mv.w>W+40){mv.x=W+40-mv.w;dir=-1}}
  const n=blocks.length,target=Math.max(0,H*.42-baseY()+(n-1)*BH);cam+=(target-cam)*.1*dt;
  debris.forEach(d=>{d.vy+=.55*dt;d.y=(d.y||0)+d.vy*dt});debris=debris.filter(d=>d.y<H);
  fx.forEach(f=>f.t+=.045*dt);fx=fx.filter(f=>f.t<1);shake*=.85;flash*=.9;parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.35*dt;p.l-=.012*dt});parts=parts.filter(p=>p.l>0);
  draw(t);requestAnimationFrame(frame)
}
function draw(t){
  g.setTransform(sc,0,0,sc,0,0);
  const B=BGS[sv.bg],gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,B.a);gr.addColorStop(1,B.b);g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';stars.forEach(s=>{const y=((s.y-cam*.15)%H+H)%H;g.globalAlpha=.25+.5*Math.abs(Math.sin(t/900+s.x));g.fillRect(s.x,y,s.r,s.r)});g.globalAlpha=1;
  g.save();if(shake>.3)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const bl=(b,c)=>{const y=sy(b.i);if(y>H+BH||y<-BH)return;g.fillStyle=c;g.beginPath();g.roundRect?g.roundRect(b.x,y-BH,b.w,BH-2,5):g.rect(b.x,y-BH,b.w,BH-2);g.fill();g.fillStyle='rgba(255,255,255,.28)';g.fillRect(b.x+2,y-BH,b.w-4,5)};
  if(runBest>0&&st!=='home'){const y=sy(runBest+off)-BH;if(y>0&&y<H){g.setLineDash([8,6]);g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.setLineDash([]);g.fillStyle='rgba(255,255,255,.8)';g.font='14px Lilita One,sans-serif';g.fillText((chall?'FRIEND ':'BEST ')+runBest,8,y-6)}}
  blocks.forEach(b=>bl(b,b.gold?'#ffd23f':col(b.i)));
  if(st==='play')bl(mv,mv.gold?'#ffd23f':col(mv.i));
  debris.forEach(d=>{g.globalAlpha=Math.max(0,1-(d.y||0)/300);g.fillStyle=col(d.i);g.fillRect(d.x,sy(d.i)-BH+(d.y||0),d.w,BH-2)});g.globalAlpha=1;
  fx.forEach(f=>{const y=sy(f.i)-BH/2,b=f.s==='bolt';g.strokeStyle=b?`rgba(255,226,90,${1-f.t})`:`rgba(255,255,255,${1-f.t})`;g.lineWidth=b?5:3;g.strokeRect(f.x-f.t*14,y-BH/2-f.t*6,f.w+f.t*28,BH+f.t*12);if(b)g.strokeRect(f.x-f.t*30,y-BH/2-f.t*14,f.w+f.t*60,BH+f.t*28)});
  g.restore();
  parts.forEach(p=>{g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.fillRect(p.x,p.y,6,9)});g.globalAlpha=1;
  if(st==='play'&&combo>=5){g.fillStyle=`rgba(255,120,40,${.05+.04*Math.sin(t/120)})`;g.fillRect(0,0,W,H)}
  if(flash>.05){g.fillStyle=`rgba(255,80,120,${flash*.35})`;g.fillRect(0,0,W,H)}
}
requestAnimationFrame(frame);
/* ---------- input ---------- */
stage.addEventListener('pointerdown',e=>{if(st==='play'&&!e.target.closest('button')){e.preventDefault();place()}});
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='Enter'){if(st==='play'){e.preventDefault();place()}}});
/* ---------- home / over ---------- */
const today=()=>new Date().toISOString().slice(0,10);
function refresh(){
  $('#hb').textContent=sv.bm[sv.mode];$('#hcoin').textContent=sv.coins;$('#sc2').textContent=sv.coins;
  $('#snd').textContent=sv.snd?'Sound on':'Sound off';$('#mode').textContent='Mode: '+MODES[sv.mode].n;$('#hsb').hidden=!(sv.hs>0);$('#hsb').textContent='Head start: '+(sv.hson?'ON':'off')+' ('+sv.hs+')';$('#chb').hidden=!chall;$('#chb').textContent='Beat your friend: '+chall;$('#hshop').textContent='Shop'+(qReady()?' •':'');
  const can=sv.daily.last!==today();$('#daily').classList.toggle('glow',can);$('#daily').textContent=can?'Daily gift!':'Gift claimed';
}
function goHome(){st='home';$('#over').hidden=true;$('#shop').hidden=true;$('#home').hidden=false;$('#hud').hidden=true;$('#hc').hidden=true;refresh()}
$('#play').onclick=begin;$('#again').onclick=begin;$('#ohome').onclick=goHome;
$('#snd').onclick=()=>{sv.snd=sv.snd?0:1;persist();refresh();tone(600)};
$('#hsb').onclick=()=>{sv.hson=sv.hson?0:1;persist();refresh()};
$('#mode').onclick=()=>{const k=Object.keys(MODES);sv.mode=k[(k.indexOf(sv.mode)+1)%k.length];persist();refresh();toast(MODES[sv.mode].n+': '+MODES[sv.mode].d)};
$('#daily').onclick=()=>{
  if(sv.daily.last===today()){toast('Come back tomorrow');return}
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  sv.daily.streak=sv.daily.last===y?sv.daily.streak+1:1;sv.daily.last=today();
  const r=50+Math.min(sv.daily.streak-1,6)*25;sv.coins+=r;persist();refresh();toast('+'+r+' coins. Day '+sv.daily.streak);tone(700,.15,'triangle');
};
function makeCard(){
  const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d'),B=BGS[sv.bg];
  const gr=x.createLinearGradient(0,0,0,1350);gr.addColorStop(0,B.a);gr.addColorStop(1,B.b);x.fillStyle=gr;x.fillRect(0,0,1080,1350);
  const n=Math.min(blocks.length,16),bh=46;
  for(let k=0;k<n;k++){const i=blocks.length-n+k,b=blocks[i],w=b.w*2.2,xx=540+(b.x+b.w/2-W/2)*2.2-w/2;x.fillStyle=b.gold?'#ffd23f':col(i);x.fillRect(xx,1240-k*bh,w,bh-3)}
  x.textAlign='center';x.fillStyle='#fff';x.font='bold 210px "Lilita One",sans-serif';x.fillText(score,540,330);
  x.font='64px "Lilita One",sans-serif';x.fillText('blocks stacked in NEON STACK',540,430);
  x.font='48px "Lilita One",sans-serif';x.fillStyle='rgba(255,255,255,.85)';x.fillText('Can you beat me?',540,500);
  return c}
$('#share').onclick=async()=>{
  const url=location.href.split('#')[0]+'#c='+score,text=`I stacked ${score} blocks in Neon Stack. Can you beat me?`;
  let blob=null;try{blob=await new Promise(r=>makeCard().toBlob(r,'image/png'))}catch(e){}
  try{
    if(blob&&navigator.canShare){const f=new File([blob],'neon-stack.png',{type:'image/png'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:text+' '+url});return}}
    if(navigator.share){await navigator.share({text,url});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  if(blob){$('#cimg').src=URL.createObjectURL(blob);$('#card').hidden=false}
  try{await navigator.clipboard.writeText(text+' '+url);toast('Link copied')}catch(e){}
};
$('#cx').onclick=()=>{$('#card').hidden=true};
/* ---------- shop ---------- */
let tab='skins',from='home';
function openShop(f){from=f;$('#home').hidden=true;$('#over').hidden=true;$('#shop').hidden=false;renderShop()}
$('#hshop').onclick=()=>openShop('home');$('#oshop').onclick=()=>openShop('over');
$('#sx').onclick=()=>{$('#shop').hidden=true;from==='over'?($('#over').hidden=false):goHome();refresh()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderShop()});
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function pay(p){if(sv.coins<p){toast('Not enough coins');tone(200,.15,'square',.07);return false}sv.coins-=p;tone(800,.12,'triangle');return true}
function renderShop(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  $('#sc2').textContent=sv.coins;const L=$('#list');L.textContent='';
  if(tab==='skins'||tab==='bgs'){
    const cat=tab==='skins'?SKINS:BGS,key=tab==='skins'?'skin':'bg';
    Object.entries(cat).forEach(([id,o])=>{
      const own=sv.own.includes(id),on=sv[key]===id,it=el('div','it'+(on?' on':''));
      if(tab==='skins'){const pv=el('div','pv');for(let i=0;i<5;i++){const s=el('i');s.style.background=o.f(i);pv.appendChild(s)}it.appendChild(pv)}
      else{const pv=el('div','pvb');pv.style.background=`linear-gradient(${o.a},${o.b})`;it.appendChild(pv)}
      const inf=el('div','inf');inf.appendChild(el('b','',o.n));inf.appendChild(el('small','',own?(on?'In use':'Owned'):'Locked'));it.appendChild(inf);
      const b=el('button','buy',on?'Equipped':own?'Equip':'🪙 '+o.p);b.disabled=on;
      b.onclick=()=>{if(!own){if(!pay(o.p))return;sv.own.push(id)}sv[key]=id;persist();renderShop();refresh()};
      it.appendChild(b);L.appendChild(it)});
  }else if(tab==='qs'){
    ensureQ();
    const h=el('div','it'),hi=el('div','inf');hi.appendChild(el('b','','Your stats'));hi.appendChild(el('small','','Games '+sv.games+'   Blocks '+sv.tot.blocks+'   Perfects '+sv.tot.perf));h.appendChild(hi);L.appendChild(h);
    QDEFS.forEach((q,i)=>{
      const p=Math.min(sv.q.p[q.k],q.t),done=p>=q.t,cl=sv.q.c[i],it=el('div','it'),inf=el('div','inf');
      inf.appendChild(el('b','',q.n));inf.appendChild(el('small','',p+' / '+q.t+'   Reward 🪙 '+q.r));
      const bar=el('div','bar'),fill=el('i');fill.style.width=(p/q.t*100)+'%';bar.appendChild(fill);inf.appendChild(bar);it.appendChild(inf);
      const b=el('button','buy',cl?'Claimed':done?'Claim':'Keep going');b.disabled=!done||cl;
      b.onclick=()=>{sv.q.c[i]=true;sv.coins+=q.r;persist();toast('+'+q.r+' coins');tone(800,.12,'triangle');renderShop();refresh()};
      it.appendChild(b);L.appendChild(it)});
    const sk=el('div','it'),si=el('div','inf');si.appendChild(el('b','','Daily streak'));si.appendChild(el('small','','Day '+sv.daily.streak+'. Claim the gift every day to grow it'));
    const pp=el('div','pips');for(let i=0;i<7;i++)pp.appendChild(el('i',sv.daily.streak>0&&i<((sv.daily.streak-1)%7+1)?'f':''));si.appendChild(pp);sk.appendChild(si);L.appendChild(sk);
    ACH.forEach(a=>{
      const st2=sv.ach[a.id]||0,it=el('div','it'),inf=el('div','inf');
      inf.appendChild(el('b','',a.n));inf.appendChild(el('small','',a.d+'   🪙 '+a.r));it.appendChild(inf);
      const b=el('button','buy',st2===2?'Claimed':st2===1?'Claim':'Locked');b.disabled=st2!==1;
      b.onclick=()=>{sv.ach[a.id]=2;sv.coins+=a.r;persist();toast('+'+a.r+' coins');tone(800,.12,'triangle');renderShop();refresh()};
      it.appendChild(b);L.appendChild(it)});
  }else{
    Object.entries(UPS).forEach(([id,o])=>{
      const lv=sv.up[id],maxed=lv>=o.max,it=el('div','it'),inf=el('div','inf');
      inf.appendChild(el('b','',o.n));inf.appendChild(el('small','',o.d));
      const pips=el('div','pips');for(let i=0;i<o.max;i++)pips.appendChild(el('i',i<lv?'f':''));inf.appendChild(pips);it.appendChild(inf);
      const c=maxed?0:o.cost(lv),b=el('button','buy',maxed?'Maxed':'🪙 '+c);b.disabled=maxed;
      b.onclick=()=>{if(!pay(c))return;sv.up[id]++;persist();renderShop();refresh()};
      it.appendChild(b);L.appendChild(it)});
    const hsI=el('div','it'),hi=el('div','inf');hi.appendChild(el('b','','Head start'));hi.appendChild(el('small','','Begin a run with 10 blocks built. Owned: '+sv.hs));hsI.appendChild(hi);
    const hb=el('button','buy','🪙 120');hb.onclick=()=>{if(!pay(120))return;sv.hs++;persist();renderShop();refresh()};hsI.appendChild(hb);L.appendChild(hsI);
    const ch=el('div','it'),ci=el('div','inf');ci.appendChild(el('b','','Mystery chest'));ci.appendChild(el('small','','Unlocks a random block, world or effect'));ch.appendChild(ci);
    const cb=el('button','buy','🪙 250');cb.onclick=()=>{
      const pool=[];Object.keys(SKINS).forEach(k=>{if(!sv.own.includes(k))pool.push(['skin',k,SKINS[k].n])});Object.keys(BGS).forEach(k=>{if(!sv.own.includes(k))pool.push(['bg',k,BGS[k].n])});Object.keys(FX).forEach(k=>{if(!sv.ownfx.includes(k))pool.push(['fx',k,FX[k].n])});
      if(!pool.length){toast('You own everything!');return}
      if(!pay(250))return;const w=pool[Math.floor(Math.random()*pool.length)];(w[0]==='fx'?sv.ownfx:sv.own).push(w[1]);persist();toast('You got '+w[2]+'!');renderShop();refresh()};
    ch.appendChild(cb);L.appendChild(ch);
    Object.entries(FX).forEach(([id,o])=>{
      const own=sv.ownfx.includes(id),on=sv.fxs===id,it=el('div','it'+(on?' on':'')),inf=el('div','inf');
      inf.appendChild(el('b','','Effect: '+o.n));inf.appendChild(el('small','',o.d));it.appendChild(inf);
      const b=el('button','buy',on?'Equipped':own?'Equip':'🪙 '+o.p);b.disabled=on;
      b.onclick=()=>{if(!own){if(!pay(o.p))return;sv.ownfx.push(id)}sv.fxs=id;persist();renderShop()};it.appendChild(b);L.appendChild(it)});
  }
}
reset();refresh();
</script>
