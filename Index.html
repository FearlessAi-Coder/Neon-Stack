<body>
<div class="wrap">
<canvas id="g" width="360" height="540" aria-label="Bluebit V3 pixel bird game. Tap, click or press space to flap."></canvas>
<div id="panel" hidden><div id="phead"></div><div id="tabs"></div><div id="pbody"></div><button id="pclose" class="alt">BACK TO GAME</button></div><div id="pass" hidden></div><div id="evt" hidden></div><div id="hatch" hidden></div><div id="adfull" hidden><div id="adl"></div><div id="adb">AD SPACE<br>(VIDEO / INTERSTITIAL)</div><button id="adbtn" class="alt" disabled></button></div>
</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('g'),c=cv.getContext('2d');
const W=360,H=540,PW=64,R=13,GROUND=H-72,FONT="'Press Start 2P',monospace",D='#543847',BX=76;
/* ===== ECONOMY (all tuning lives here) =====
   pt = coins per point (x mode multiplier), cap = max score-coins per run, coinP = chance a pipe carries a coin,
   ad/adMax = rewarded-ad coins and daily limit, daily = 7-day streak rewards, bo = boost prices */
const ECON={pt:.25,cap:60,rev:15,coinP:.18,ad:20,adMax:3,daily:[5,8,10,12,15,18,25],trophy:10,tut:20,dr:15,bo:{sh:50,mag:60,dbl:80}};
const REV=ECON.rev;

let ac=null,sfxBus,musBus,noiseBuf,gest=false,mCur='',mStep=0,mNext=0;
function getAC(){
  if(ac)return ac;
  try{
    ac=new(window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.connect(ac.destination);
    sfxBus=ac.createGain();musBus=ac.createGain();sfxBus.connect(comp);musBus.connect(comp);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    applyVol();
  }catch(e){ac=null;}
  return ac;
}
function applyVol(){if(!ac)return;sfxBus.gain.value=S.sfx?S.vs:0;musBus.gain.value=S.mus?S.vm:0;}
function unlockAudio(){gest=true;if(getAC()&&ac.state==='suspended')ac.resume().catch(()=>{});}
function beep(f,d,type,v,slide){
  if(!S.sfx)return;
  try{if(!getAC())return;if(ac.state==='suspended')ac.resume().catch(()=>{});const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d);}catch(e){}
}
const vib=ms=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};
const mf=n=>440*Math.pow(2,(n-69)/12);
function nt(f,t,d,type,g,lp,det){
  const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;
  v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.012);v.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.04,d));
  o.connect(v);let out=v;if(lp){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;v.connect(fl);out=fl;}
  out.connect(musBus);o.start(t);o.stop(t+Math.max(.04,d)+.03);
}
function kick(t,g){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);v.gain.setValueAtTime(.5*g,t);v.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(v);v.connect(musBus);o.start(t);o.stop(t+.19);}
function nz(t,d,g,fr,bp){const s2=ac.createBufferSource();s2.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=bp?'bandpass':'highpass';f.frequency.value=fr;const v=ac.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);s2.connect(f);f.connect(v);v.connect(musBus);s2.start(t,Math.random()*.5);s2.stop(t+d+.03);}

function pipeDeco(P,x,y0,y1,cy,cb){
  const t=P.t,len=y1-y0,step=t==='brick'?14:t==='tech'?26:t==='cloud'?30:38;

  for(let yy=y0+26;yy<y1-26;yy+=step){const k=((yy-y0)/step)|0;
    if(t==='brick'){c.fillStyle=P.s;c.fillRect(x+7,yy,PW-14,2);c.fillRect(x+16+(k%2)*16,yy-14,2,14);}
